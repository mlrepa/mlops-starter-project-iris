name: CI

on:
  push:
    branches: [ main, dev, deployment ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: make install

    - name: Run code quality checks (Linting, Formatting Check, Type Check, Pre-commit hooks)
      run: make check-all

    - name: Run tests with coverage
      run: make test-cov

  train-model:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      run: make install

    - name: Download & preprocess data
      run: |
        uv run python src/load_data.py
        uv run python src/split_dataset.py --test_size 0.2

    - name: Run training script
      run: uv run python src/train.py

    - name: Upload model artifact
      uses: actions/upload-artifact@v4
      with:
        name: iris-model
        path: models/model.joblib

    - name: Upload data artifacts
      uses: actions/upload-artifact@v4
      with:
        name: processed-data
        path: |
          data/features_iris.csv
          data/test.csv

  evaluate-model:
    runs-on: ubuntu-latest
    needs: train-model
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      run: make install

    - name: Download iris-model artifact
      uses: actions/download-artifact@v4
      with:
        name: iris-model
        path: models/

    - name: Download processed-data artifact
      uses: actions/download-artifact@v4
      with:
        name: processed-data
        path: data/

    - name: Verify model file exists
      run: |
        if [ ! -f "models/model.joblib" ]; then
          echo "Error: model.joblib not found in models/ directory"
          exit 1
        fi
        echo "Model file verified: models/model.joblib exists"

    - name: Run evaluation script
      run: uv run python src/evaluate.py

    - name: Upload evaluation metrics
      uses: actions/upload-artifact@v4
      with:
        name: evaluation-metrics
        path: data/eval.json

  deploy:
    runs-on: ubuntu-latest
    needs: [test, train-model, evaluate-model]
    if: github.ref == 'refs/heads/deployment'
    steps:
    - uses: actions/checkout@v4

    - name: Download iris-model artifact
      uses: actions/download-artifact@v4
      with:
        name: iris-model
        path: models/

    - name: Download evaluation metrics
      uses: actions/download-artifact@v4
      with:
        name: evaluation-metrics
        path: data/

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build API Docker image
      run: |
        cd api
        docker build -t iris-api:latest .

    - name: Build UI Docker image
      run: |
        cd ui
        docker build -t iris-ui:latest .

    - name: Start services for testing
      run: |
        docker-compose -f docker-compose.local.yml up -d
        sleep 30

    - name: Install Python dependencies for testing
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Test deployed services
      run: |
        python scripts/test_api.py

    - name: Stop services
      run: |
        docker-compose -f docker-compose.local.yml down

    - name: Display deployment summary
      run: |
        echo "🎉 Deployment successful!"
        echo "📊 Model metrics:"
        if [ -f "data/eval.json" ]; then
          cat data/eval.json
        fi
        echo ""
        echo "🐳 Docker images built:"
        echo "  - iris-api:latest"
        echo "  - iris-ui:latest"
        echo ""
        echo "📋 Ready for production deployment to Render"
